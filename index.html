<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />

    <title>Base Apparel coming soon page</title>
  </head>
  <body>
    <main class="main-index">
      <div class="main-containier">
        <section class="hero-info">
          <img
            class="logo-image"
            src="./images/logo.svg"
            alt="logotip of base apparel"
          />
          <h1 class="hero-title">We're coming soon</h1>
          <p class="hero-descprition">
            Hello fellow shoppers! We're currently building our new fashion
            store. Add your email below to stay up-to-date with announcements
            and our launch deals.
          </p>

          <form action="https://echo.htmlacademy.ru/courses" method="post">
            <label for="email"></label
            ><input
              type="text"
              name="email"
              placeholder="Email Address"
              id="email"
            />
            <span class="vissually-hiden">Email Address</span
            ><input class="sub-btn" type="submit" />
          </form>
        </section>
        <img
          class="image-hero"
          src="./images/hero-desktop.jpg"
          alt="Fashion photo of woman model in orange shirt"
          width="610"
          height="800"
        />
      </div>
    </main>
    
  </body>
</html>

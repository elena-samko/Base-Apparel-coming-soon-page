<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />

    <title>Base Apparel</title>
  </head>
  <body>
    <main class="main">
      <div class="main-contanier">
        <img class="hero__logo" src="./images/logo.svg" alt="base apparel" />
        <section class="hero">
          <h1 class="hero__title">
            <span class="hero__title-accent">We're</span> coming soon
          </h1>
          <p class="hero__descprition">
            Hello fellow shoppers! We're currently building our new fashion
            store. Add your email below to stay up-to-date with announcements
            and our launch deals.
          </p>

          <form
            action="https://echo.htmlacademy.ru/courses"
            class="hero__form"
            method="post"
          >
            <label for="email" class="vissually-hiden">Email Address</label
            ><input
              class="hero__input"
              type="email"
              name="email"
              placeholder="Email Address"
              id="email"
              required
              aria-describedby="email-error"
            />
            <span class="hero__error-icon" aria-hidden="true"></span>
            <span class="hero__error-message" id="email-error">
              Please provide a valid email
            </span>

            <button type="submit" class="hero__submit">
              <span class="vissually-hiden">Subscribe</span>
            </button>
          </form>
        </section>
        <picture class="hero_picture">
          <source
            media="(max-width: 375px)"
            srcset="./images/hero-mobile.jpg"
          />
          <source
            media="(max-width: 768px)"
            srcset="./images/hero-tablet.jpg"
          />

          <img
            class="hero_img"
            src="./images/hero-desktop.jpg"
            alt="Fashion photo of woman model in orange shirt"
            width="610"
            height="800"
          />
        </picture>
      </div>
    </main>
  </body>
</html>
